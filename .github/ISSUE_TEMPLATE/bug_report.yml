name: Bug report
description: Report incorrect behavior, data semantics, installation trouble, or a regression.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the public beta. Remove credentials, raw transcript content, private paths, and account identifiers before submitting. Security issues must use the private process in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: aibill version
      description: Run `npx aibill --version` or provide the commit SHA.
      placeholder: 0.6.1
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - CLI
        - MCP or plugin
        - Glance for macOS
        - Provider connector
        - Website or documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Redacted reproduction steps
      description: Use synthetic values and remove home paths, project names, credentials, and transcript text.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node version, AI client/provider, and installation method.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, raw prompts/responses, private paths, and identifying account data.
          required: true
