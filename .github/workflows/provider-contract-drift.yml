name: Provider contract drift

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview the alert issue writes in the run summary without changing any issue
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

# Two overlapping runs could both open an issue for the same drifted page.
concurrency:
  group: provider-contract-drift
  cancel-in-progress: false

jobs:
  contracts:
    name: Official provider contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate reviewed contract declarations
        id: static
        continue-on-error: true
        run: npm run check:provider-contracts
      - name: Fetch and compare official contracts
        id: drift
        continue-on-error: true
        run: npm run check:provider-contract-drift
      - name: Run provider structural fixtures
        id: fixtures
        continue-on-error: true
        run: npx vitest run packages/core/src/providerConnectors.test.ts packages/core/src/sourceStatus.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: provider-contract-drift-report
          path: provider-contract-drift.json
          if-no-files-found: error
      # One issue per drifted official page, keyed by contract ID, resource kind
      # and URL: opened when the page drifts, updated while it stays drifted,
      # closed once it matches its reviewed baseline again. Runs on every
      # outcome except cancellation, so resolved pages close. Writes only on the
      # default branch; other refs and dry_run dispatches preview the plan in
      # the run summary.
      - name: Sync per-page drift issues
        if: ${{ !cancelled() }}
        uses: actions/github-script@v7
        env:
          STATIC_OUTCOME: ${{ steps.static.outcome }}
          DRIFT_OUTCOME: ${{ steps.drift.outcome }}
          FIXTURES_OUTCOME: ${{ steps.fixtures.outcome }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        with:
          script: |
            const { runProviderContractAlerts } = await import('${{ github.workspace }}/scripts/provider-contract-alerts.mjs');
            await runProviderContractAlerts({ github, context, core });
      - name: Fail unresolved drift
        if: always() && (steps.static.outcome == 'failure' || steps.drift.outcome == 'failure' || steps.fixtures.outcome == 'failure')
        run: exit 1
