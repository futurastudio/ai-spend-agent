name: Launch canary

# Synthetic launch-week canary: proves the PUBLISHED package installs and the
# public endpoints answer, from a machine we do not control. Telemetry only
# reports from machines where the CLI actually runs — a broken publish, a dead
# endpoint, or a downed site produces silence, not signal. This closes that
# gap with zero new infrastructure: a scheduled failure here emails repo
# watchers via GitHub's native workflow-failure notifications.
#
# Every probe is read-only or intentionally invalid — nothing is stored by any
# request this workflow makes, and telemetry is hard-disabled three ways
# (DO_NOT_TRACK, AI_SPEND_NO_TELEMETRY, and the CI env GitHub always sets —
# packages/cli/src/telemetry.ts treats each as a kill-switch).

on:
  schedule:
    # Every 30 minutes during launch week. Relax to hourly or a few times a
    # day once launch week is over — edit this cron, nothing else.
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  canary:
    name: Publish + endpoints canary
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      # Belt and suspenders: CI detection alone already disables telemetry,
      # but the canary must NEVER pollute launch analytics even if that
      # detection changes.
      DO_NOT_TRACK: "1"
      AI_SPEND_NO_TELEMETRY: "1"
    steps:
      # The CLI requires Node >= 22 (packages/cli engines) and exits 1 with
      # an upgrade hint on older majors — pin so a runner-image default
      # change can never masquerade as a broken publish.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npx install + version
        run: |
          v="$(npx -y aibill@latest --version </dev/null)"
          echo "aibill@latest --version -> [$v]"
          echo "$v" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$'
          # A bare semver match stays green through a rollback. Pin the floor:
          # bump EXPECTED_MIN_VERSION with each release.
          EXPECTED_MIN_VERSION="0.9.6"
          if [ "$(printf '%s\n' "$EXPECTED_MIN_VERSION" "$v" | sort -V | head -1)" != "$EXPECTED_MIN_VERSION" ]; then
            echo "FAIL: npm latest is $v, older than the expected floor $EXPECTED_MIN_VERSION — possible rollback or unpublish"
            exit 1
          fi

      - name: cold receipt (fresh home, non-TTY)
        run: |
          # Contract (packages/cli/src/index.ts, noEvidenceResult): the bare
          # receipt on a machine with NO agent evidence exits 0 by design —
          # the honest empty receipt is a success, not an error. Non-TTY
          # stdin+stdout means no interactive ask and no spinner.
          H="$(mktemp -d "$RUNNER_TEMP/canary-home.XXXXXX")"
          cd "$H"
          rc=0
          HOME="$H" npx -y aibill@latest </dev/null >out.txt 2>err.txt || rc=$?
          echo "exit=$rc"
          echo "--- stdout ---"; cat out.txt
          echo "--- stderr ---"; cat err.txt
          test "$rc" -eq 0
          grep -q "aibill" out.txt

      - name: report from home (machine-wide)
        run: |
          # Contract (packages/cli/src/index.ts, noEvidenceResult "report"
          # surface): report from $HOME runs machine-wide; with no evidence
          # it exits 1 and says so honestly on stderr. Anything else — the
          # old "Refusing to scan" guard or the crash wrapper's "unexpected
          # error" voice — is a regression the failure email should name.
          H="$(mktemp -d "$RUNNER_TEMP/canary-home.XXXXXX")"
          cd "$H"
          rc=0
          HOME="$H" npx -y aibill@latest report </dev/null >out.txt 2>err.txt || rc=$?
          echo "exit=$rc"
          echo "--- stdout ---"; cat out.txt
          echo "--- stderr ---"; cat err.txt
          test "$rc" -eq 1
          grep -q "No report was written because there is no supported financial evidence" err.txt
          if grep -qi "Refusing" out.txt err.txt; then
            echo "FAIL: refusal voice leaked into the no-evidence report path"; exit 1
          fi
          if grep -qi "unexpected error" out.txt err.txt; then
            echo "FAIL: crash-wrapper voice leaked into the no-evidence report path"; exit 1
          fi

      - name: no internal jargon on the degraded machine-wide path
        run: |
          # 0.9.6 founder-found regression class, guarded in PRODUCTION.
          #
          # The previous version of this check ran in an EMPTY mktemp home,
          # where `report` exits 1 and writes nothing. Both greps therefore
          # scanned a zero-byte stdout and a zero-file `find` — structurally
          # incapable of failing, and green 48 times a day. Verified: all four
          # phrases scored 0 hits against a genuinely degraded artifact.
          #
          # Three things make it able to bite now:
          #   1. The home is SEEDED, so the commands produce real artifacts.
          #   2. One transcript is unreadable, so the run takes the DEGRADED
          #      rendering path — the one that speaks in internal state. A
          #      complete-coverage fixture never reaches that code.
          #   3. A `test -f` precondition fails the step when the expected
          #      artifacts are absent, so "nothing to scan" can never again be
          #      mistaken for "nothing to find".
          H="$(mktemp -d "$RUNNER_TEMP/canary-jargon.XXXXXX")"
          day() { date -u -d "-$1 days" +%Y-%m-%dT%H:%M:%S.000Z 2>/dev/null \
                  || date -u -v-"$1"d +%Y-%m-%dT%H:%M:%S.000Z; }
          for project in alpha-app beta-svc gamma-lib; do
            d="$H/.claude/projects/-Users-testuser-$project"
            mkdir -p "$d"
            : > "$d/sess-$project.jsonl"
            for i in 2 3 4; do
              printf '%s\n' "{\"type\":\"assistant\",\"timestamp\":\"$(day $i)\",\"cwd\":\"/Users/testuser/$project\",\"sessionId\":\"sess-$project\",\"requestId\":\"req-$project-$i\",\"message\":{\"id\":\"msg-$project-$i\",\"model\":\"claude-opus-4-8\",\"usage\":{\"input_tokens\":40000,\"output_tokens\":4000,\"cache_read_input_tokens\":100000,\"cache_creation_input_tokens\":10000}}}" \
                >> "$d/sess-$project.jsonl"
            done
          done
          # The degraded branch: one transcript the scanner cannot read.
          chmod 000 "$H/.claude/projects/-Users-testuser-gamma-lib/sess-gamma-lib.jsonl"

          cd "$H"
          HOME="$H" npx -y aibill@latest report </dev/null > report-out.txt 2> report-err.txt || true
          HOME="$H" npx -y aibill@latest --full </dev/null > full-out.txt 2> full-err.txt || true
          HOME="$H" npx -y aibill@latest report-card </dev/null > card-out.txt 2> card-err.txt || true
          echo "--- report stdout ---"; cat report-out.txt

          # PRECONDITION. Without this an empty scan set reads as a pass, which
          # is exactly how the old check stayed green through the regression.
          for artifact in ai-spend-report.md ai-spend-report.html ai-receipt.svg; do
            if [ ! -f "$H/$artifact" ]; then
              echo "FAIL: expected artifact $artifact was not written — this check scanned nothing"; exit 1
            fi
          done
          # …and the degraded path must actually have run, or we are only
          # sweeping the happy path under a misleading name.
          if ! grep -qi "session transcripts" "$H/ai-spend-report.md"; then
            echo "FAIL: fixture did not trip partial coverage — the degraded branch was never rendered"; exit 1
          fi

          # Recursive: sidecar artifacts land under .ai-spend-agent/, which a
          # -maxdepth 1 find could never reach.
          artifacts="$(find "$H" -type f \( -name '*.md' -o -name '*.html' -o -name '*.svg' \) 2>/dev/null)"
          echo "--- artifacts swept ---"; echo "$artifacts"
          for phrase in \
            "qualitative index" \
            "qualitative indexing is" \
            "bounded transcript index" \
            "bounded index" \
            "NON-EXECUTABLE."
          do
            # -i: the code emitted a capital-Q "Qualitative indexing is", which
            # a case-sensitive sweep missed entirely.
            if grep -qiF "$phrase" ./*-out.txt ./*-err.txt 2>/dev/null; then
              echo "FAIL: internal-jargon degradation voice reached the user: [$phrase]"; exit 1
            fi
            if [ -n "$artifacts" ] && printf '%s\n' "$artifacts" | tr '\n' '\0' \
                 | xargs -0 grep -liF "$phrase" 2>/dev/null | grep -q .; then
              echo "FAIL: internal-jargon degradation voice reached a written artifact: [$phrase]"; exit 1
            fi
          done
          # B1: a markdown-voiced command must never render its grave accents
          # into HTML that auto-opens in a browser.
          if grep -l '`' "$H"/*.html 2>/dev/null | grep -q .; then
            echo "FAIL: literal backtick rendered in an HTML artifact"; exit 1
          fi

      - name: telemetry endpoint alive
        if: always()  # production monitoring must never be switched off by an upstream fixture failure
        run: |
          # An intentionally INVALID body: {} fails the exactly-one-"events"-
          # key envelope check (apps/web/app/api/telemetry/route.ts) and is
          # rejected with 422 before anything could be stored. 422 = endpoint
          # alive and enforcing its schema; 5xx or a timeout = down.
          code="$(curl -s -o /dev/null -w '%{http_code}' -m 15 \
            -X POST -H 'content-type: application/json' -d '{}' \
            https://asktilden.com/api/telemetry)"
          echo "POST {} /api/telemetry -> $code (expected 422)"
          test "$code" = "422"

      - name: waitlist endpoint alive
        if: always()  # production monitoring must never be switched off by an upstream fixture failure
        run: |
          # {} is valid JSON with no usable email, so the route rejects it
          # with 422 (apps/web/app/api/waitlist/route.ts; 400 is reserved for
          # malformed JSON). Nothing is stored, and no real-looking email is
          # ever sent. One POST per run stays far under the 5/min rate limit.
          #
          # SCOPE — READ THIS BEFORE TRUSTING IT: 422 is returned at email
          # validation, BEFORE storeInSupabase() is called. This step proves
          # the route is alive and enforcing its schema. It proves NOTHING
          # about whether a signup can actually be stored — a rotated
          # service-role key would 503 every real signup while this stayed
          # green. The storage path is proven by the `waitlist-storage` job
          # in .github/workflows/launch-alerts.yml, which does a real
          # insert+delete round trip. Do not delete that job believing this
          # one covers it.
          code="$(curl -s -o /dev/null -w '%{http_code}' -m 15 \
            -X POST -H 'content-type: application/json' -d '{}' \
            https://asktilden.com/api/waitlist)"
          echo "POST {} /api/waitlist -> $code (expected 422)"
          test "$code" = "422"

      - name: site up
        if: always()  # production monitoring must never be switched off by an upstream fixture failure
        run: |
          curl -sfS -o /dev/null -m 15 https://asktilden.com
          curl -s -m 15 https://asktilden.com | grep -qi "Tilden"
