name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  packages:
    name: Typecheck, test, build, smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:adapters
      - run: npm run check:public-boundary
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build
      - run: node scripts/benchmark-context-health.mjs
      - run: node scripts/benchmark-init.mjs
      # Smoke test the built bin exactly as npm ships it — guards the
      # stale-dist / broken-bin class of bug that already shipped once.
      - run: node packages/cli/dist/index.js --help
      - run: node packages/cli/dist/index.js --sample --no-color
      # Alias bin must run the exact same CLI.
      - run: node packages/aibill/run.js --help
      # Spawn the built MCP server, negotiate the protocol, list all tools,
      # and verify the broad-root safety guard. Unit coverage separately
      # exercises npm-style bin symlink resolution.
      - run: node scripts/smoke-mcp.mjs
      # Exercise all eight tools over the built stdio protocol against an
      # isolated empty environment plus an explicitly labeled sample state.
      - run: npm run audit:mcp-fixtures
      # The workspace build above refreshes dist; now dry-pack every
      # publishable package and inspect its public manifest.
      - run: npm run check:release-packages
      # Install all five real tarballs into an empty consumer project, then
      # exercise the CLI alias and MCP protocol from the installed graph.
      - run: npm run smoke:packed-install

  web:
    name: Waitlist app typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
        working-directory: apps/web
      - run: npx next build
        working-directory: apps/web

  glance-macos:
    name: Glance macOS tests + ad-hoc bundle
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path apps/glance-macos
      - run: ./apps/glance-macos/scripts/build-app.sh
      - run: codesign --verify --deep --strict --verbose=2 "apps/glance-macos/dist/aibill Glance.app"

  audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --audit-level=high
